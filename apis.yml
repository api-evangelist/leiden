aid: leiden
name: Leiden University
x-type: university
x-category: Public Research University
description: >-
  Leiden University (Universiteit Leiden), founded 1575, is the oldest university
  in the Netherlands and a founding member of LERU. It operates a federation of
  bought systems, not a developer program: it publishes no public REST API and no
  developer portal, api.universiteitleiden.nl, api.leidenuniv.nl,
  developer.universiteitleiden.nl and data.universiteitleiden.nl do not resolve,
  and neither of its GitHub organisations holds a single OpenAPI or Swagger file.
  What it does operate, on its own infrastructure, are three verified
  machine-readable surfaces: an OAI-PMH 2.0 endpoint for the Scholarly
  Publications repository, a signed SAML 2.0 identity-provider metadata document
  registered in the SURFconext national federation, and a PGP-signed RFC 9116
  security.txt. Everything else that looks programmable belongs to a vendor
  Leiden buys from — Ex Libris Primo, D2L Brightspace, SURF Yoda — and is
  recorded below as a tenancy, never as Leiden's engineering.
