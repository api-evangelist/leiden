x-coverage:
  state: covered
  reason: no_public_api
  detail: >-
    Leiden University operates no public REST API and no developer program —
    api.universiteitleiden.nl, api.leidenuniv.nl, developer.universiteitleiden.nl,
    developers.universiteitleiden.nl, data.universiteitleiden.nl and
    opendata.universiteitleiden.nl all return NXDOMAIN, /llms.txt is a real 404,
    and GitHub code search across both LeidenUniversityLibrary (110 repos) and
    CWTSLeiden (13 repos) returns zero files named openapi or swagger. The
    profile is nonetheless fully covered: three institution-operated
    machine-readable surfaces were verified live (an OAI-PMH 2.0 endpoint on
    Leiden's own infrastructure, a signed SAML 2.0 IdP metadata document, and a
    PGP-signed RFC 9116 security.txt), alongside three vendor tenancies
    (Ex Libris Primo, D2L Brightspace, SURF Yoda) and three registry memberships
    (DataCite VIOJ, Crossref 22598, ROR 027bh9e22). Note for future runs: the
    universiteitleiden.nl estate answers header-poor clients with HTTP 200 and a
    "Toegang geblokkeerd / Access Blocked" body, which reads as a soft-404 —
    a full browser header set is required and then 404s are honest.
  evidence:
    - url: https://scholarlypublications.universiteitleiden.nl/oai2?verb=Identify
      status: 200
    - url: https://login.uaccess.leidenuniv.nl/nidp/saml2/metadata
      status: 200
    - url: https://www.universiteitleiden.nl/.well-known/security.txt
      status: 200
    - url: https://metadata.surfconext.nl/idps-metadata.xml
      status: 200
    - url: https://api.datacite.org/providers/vioj
      status: 200
    - url: https://brightspace.universiteitleiden.nl/d2l/api/versions/
      status: 200
    - url: https://www.universiteitleiden.nl/llms.txt
      status: 404
    - url: https://api.universiteitleiden.nl/
      status: 0
    - url: https://data.universiteitleiden.nl/
      status: 0
  checked: '2026-09-01'
